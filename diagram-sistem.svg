<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13201c"/></marker></defs>
<style>.bg{fill:#fff}.bx{fill:#f1f4f3;stroke:#9aa7a3;stroke-width:1.5}.tt{fill:#13201c;font-size:13px;font-weight:700;text-anchor:middle}.st{fill:#56645f;font-size:11px;text-anchor:middle}
.ti{fill:#13201c;font-size:18px;font-weight:700}.hn{fill:#fff;font-size:13px;font-weight:700}.bl{fill:#13201c;font-size:11.5px}.l{stroke:#13201c;stroke-width:1.5;fill:none}
.lb{fill:#13201c;font-size:11px;font-style:italic}.db{fill:#eef6f3;stroke:#0f6e5c;stroke-width:1.5;stroke-dasharray:6 4}.cp{fill:#fff;stroke:#0f6e5c;stroke-width:1.5}.cn{fill:#13201c;font-size:12px;font-weight:700;text-anchor:middle}</style>
<rect class="bg" width="1000" height="690"/>
<text class="ti" x="30" y="30">Diagram Sistem — Simulator Praktikum ERP (PHP Native + MySQL)</text>
<rect class="bx" x="380" y="48" width="240" height="40" rx="8"/><text class="tt" x="500" y="73">Pengguna (Browser)</text>
<path class="l" d="M500 88V108" marker-end="url(#a)"/>
<rect class="bx" x="30" y="110" width="940" height="46" rx="8"/><text class="tt" x="500" y="131">index.php — Antarmuka web 5 tab (P1–P5)</text><text class="st" x="500" y="147">HTML + CSS + JavaScript (fetch POST)</text>
<path class="l" d="M500 156V176" marker-end="url(#a)"/><text class="lb" x="510" y="170">JSON</text>
<rect class="bx" x="30" y="178" width="940" height="46" rx="8"/><text class="tt" x="500" y="199">api.php — Logika bisnis &amp; akses data</text><text class="st" x="500" y="215">PHP native · PDO · prepared statement · transaksi database</text>
<path class="l" d="M500 224V244M118 244H882M118 244V278M309 244V278M500 244V278M691 244V278M882 244V278" />
<path d="M118 244V278" class="l" marker-end="url(#a)"/><rect class="bx" x="30" y="280" width="176" height="135" rx="8"/><path d="M30 288a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8v22H30z" fill="#0f6e5c"/><text class="hn" x="40" y="300">P1 · Evolusi ERP</text>
<text class="bl" x="40" y="334">• Pesanan pelanggan</text>
<text class="bl" x="40" y="356">• Cek stok &amp; bahan baku</text>
<text class="bl" x="40" y="378">• Dampak kondisi khusus</text>
<text class="bl" x="40" y="400">• Riwayat pesanan</text>
<path d="M309 244V278" class="l" marker-end="url(#a)"/><rect class="bx" x="221" y="280" width="176" height="135" rx="8"/><path d="M221 288a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8v22H221z" fill="#2563eb"/><text class="hn" x="231" y="300">P2 · Arsitektur Teknis</text>
<text class="bl" x="231" y="334">• Backup &amp; pulihkan data</text>
<text class="bl" x="231" y="356">• Simulasi gangguan</text>
<text class="bl" x="231" y="378">• Matriks hak akses</text>
<text class="bl" x="231" y="400">• Skala 100→800 pengguna</text>
<path d="M500 244V278" class="l" marker-end="url(#a)"/><rect class="bx" x="412" y="280" width="176" height="135" rx="8"/><path d="M412 288a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8v22H412z" fill="#b45309"/><text class="hn" x="422" y="300">P3 · Proses Bisnis</text>
<text class="bl" x="422" y="334">• Diagram as-is vs to-be</text>
<text class="bl" x="422" y="356">• Aturan bisnis</text>
<text class="bl" x="422" y="378">• Jenjang persetujuan PO</text>
<text class="bl" x="422" y="400">• Cek persetujuan ulang</text>
<path d="M691 244V278" class="l" marker-end="url(#a)"/><rect class="bx" x="603" y="280" width="176" height="135" rx="8"/><path d="M603 288a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8v22H603z" fill="#7c3aed"/><text class="hn" x="613" y="300">P4 · Keuangan</text>
<text class="bl" x="613" y="334">• Chart of accounts</text>
<text class="bl" x="613" y="356">• Jurnal &amp; buku besar</text>
<text class="bl" x="613" y="378">• Neraca saldo</text>
<text class="bl" x="613" y="400">• Jurnal koreksi</text>
<path d="M882 244V278" class="l" marker-end="url(#a)"/><rect class="bx" x="794" y="280" width="176" height="135" rx="8"/><path d="M794 288a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8v22H794z" fill="#be185d"/><text class="hn" x="804" y="300">P5 · SCM &amp; Pembelian</text>
<text class="bl" x="804" y="334">• Hitung kebutuhan (MRP)</text>
<text class="bl" x="804" y="356">• PR → PO → GR</text>
<text class="bl" x="804" y="378">• Penerimaan barang</text>
<text class="bl" x="804" y="400">• Risiko lead time pemasok</text>
<path class="l" d="M118 415V440H672V419" marker-end="url(#a)"/><text class="lb" x="140" y="434">jurnal penjualan otomatis</text>
<path class="l" d="M882 415V462H730V419" marker-end="url(#a)"/><text class="lb" x="745" y="482">utang pembelian otomatis</text>
<rect class="db" x="30" y="515" width="940" height="125" rx="10"/><text class="tt" x="500" y="540">Database MySQL (satu basis data bersama)</text>
<rect class="cp" x="45" y="556" width="135" height="50" rx="8"/><text class="cn" x="112" y="577">inventory</text><text class="st" x="112" y="594">dipakai: P1, P5</text>
<rect class="cp" x="200" y="556" width="135" height="50" rx="8"/><text class="cn" x="267" y="577">orders</text><text class="st" x="267" y="594">dipakai: P1</text>
<rect class="cp" x="355" y="556" width="135" height="50" rx="8"/><text class="cn" x="422" y="577">journal + accounts</text><text class="st" x="422" y="594">dipakai: P1, P4, P5</text>
<rect class="cp" x="510" y="556" width="135" height="50" rx="8"/><text class="cn" x="577" y="577">purchase_orders</text><text class="st" x="577" y="594">dipakai: P5</text>
<rect class="cp" x="665" y="556" width="135" height="50" rx="8"/><text class="cn" x="732" y="577">backups</text><text class="st" x="732" y="594">dipakai: P2</text>
<rect class="cp" x="820" y="556" width="135" height="50" rx="8"/><text class="cn" x="887" y="577">sim_log</text><text class="st" x="887" y="594">dipakai: P2, P3, P5</text>
<text class="st" x="500" y="627">Setiap modul membaca/menulis data yang sama — satu transaksi langsung terlihat oleh modul lain</text>
<text class="st" x="30" y="670" style="text-anchor:start">Panah tebal antar modul = integrasi otomatis (P1 → P4 dan P5 → P4). P2 dan P3 berdiri sendiri dan mencatat hasil simulasi ke sim_log.</text>
</svg>